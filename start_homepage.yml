---
- name: Ensure all Docker containers are running
  hosts: docker
  become: true
  
  tasks:      
    - name: Get stopped containers for logging
      shell: docker ps -a --filter "status=exited" --format "{{'{{'}}.ID{{'}}'}} {{'{{'}}.Names{{'}}'}}"
      register: stopped
      changed_when: false

    - name: Show stopped containers
      debug:
        var: stopped.stdout_lines
    
    - name: Get stopped containers
      shell: docker ps -aq -f "status=exited"
      register: containers
      changed_when: false

    - name: Start all containers
      command: docker start {{ item }}
      loop: "{{ containers.stdout_lines }}"
      register: start_result

    - name: Show started containers
      debug:
        var: start_result.results
